# Dedicated conda/mamba environment for plasgenomicsutils: run, test, and benchmark.
#   mamba env create -f environment.yml     (or: conda env create -f environment.yml)
#   mamba activate plasgenomicsutils
#   pip install -e .        # editable install of this package
name: plasgenomicsutils
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.10
  # --- compute / IO (pip deps, pinned here so conda resolves htslib for pysam/cyvcf2) ---
  - numpy >=1.23
  - pandas >=1.5
  - scipy >=1.9
  - pysam >=0.21          # record mutation (harmonize) + general VCF/BCF IO
  - cyvcf2 >=0.30         # bulk FORMAT-array read/write (fast filter_ad_regenotype)
  - scikit-allel >=1.3    # rogers_huff_r for the LD scan; pairwise-complete by design
  # scikit-allel pulls dask in, and nothing in its own metadata stops a solver choosing a
  # very old one: CI once resolved dask 2023.3.0 beside numpy 2.5, and that dask imports
  # `numpy.compat`, which numpy 2.0 removed -- so `import allel` died at collection. dask
  # gained numpy 2 support in the 2024.6 series; this floor is comfortably past it. It is
  # not a dependency we use directly, only one we have to keep resolvable.
  - dask >=2024.12
  # --- external CLIs the vcf/ filtering commands shell out to ---
  # bcftools is pinned, not floored. Its behaviour is not stable across releases in ways
  # that change results silently: 1.19 does not classify a record with ALT="." as type
  # `ref`, so `bcftools view -V ref` does not remove it there and does on 1.24. The
  # filters are written not to depend on that (see `_snp_select_args`), and CI runs the
  # suite against both this pin and whatever the distro ships -- but an environment we
  # hand people should be one exact version, so what they get is what was tested.
  # Raise this deliberately, and re-run the suite on both versions when you do.
  - bcftools =1.24
  - bedtools >=2.30
  - htslib >=1.18
  # --- coverage ---
  # coverage_depth_stats computes depth with pysam when mosdepth is absent and with
  # mosdepth when it is on PATH; the two give identical numbers, so this only buys
  # speed -- but a lot of it. pysam reads roughly 90 kb of genome per second per core,
  # so a 23 Mb genome is ~4 minutes per sample without it.
  - mosdepth >=0.3
  # --- recombination-rate map (ld_recombination) -- estimators NOT installed here ---
  # ld_recombination shells out to an external estimator; neither is a dependency of this
  # env. LDhat (--emit ldhat) is the recommended one for Pf and is a separate C build --
  # see scripts/build_ldhat.sh (x86_64/Rosetta on Apple Silicon). pyrho (--emit pyrho) is
  # the fast alternative and lives in its own conda env, deliberately NOT added here: the
  # bioconda recipe (0.2.1) hard-pins `msprime >=0.7,<1.0`, msprime 0.7.x has no osx-arm64
  # build, so adding it makes the WHOLE env unsolvable on Apple Silicon. pyrho recipe
  # (osx-arm64, 2026-09):
  #   mamba create -n pyrho -c conda-forge -c bioconda python=3.11 "msprime>=1" numba \
  #       scipy "pandas<3" pytables cyvcf2 pip
  #   mamba run -n pyrho pip install \
  #       "git+https://github.com/popgenmethods/ldpop" "git+https://github.com/popgenmethods/pyrho"
  # Two non-obvious pins, both required:
  #   * install from GitHub, not `pip install pyrho`: pyrho needs `ldpop`, which is not on
  #     PyPI (GitHub-only), so plain pip cannot resolve it.
  #   * pandas<3: pandas 3.0 copy-on-write returns a read-only `.values`, and pyrho's njit
  #     `_single_vec_downsample` signature rejects a readonly array -> make_table crashes.
  # gives pyrho 0.2.1 + msprime 1.4.4 + numpy 2.4 + numba 0.67 + cyvcf2 0.34; make_table and
  # optimize (ploidy 1, the only ploidy pyrho supports -- exactly right for haploid Pf) run.
  # --- test / dev ---
  - pytest >=7.0
  - pip
